<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Aplica o tema escolhido antes de desenhar a página (evita piscar) -->
  <script>
    try {
      var tema = localStorage.getItem('tema');
      if (tema) document.documentElement.setAttribute('data-theme', tema);
    } catch (e) {}
  </script>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap">

  <!-- Folha de estilos -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="cabecalho">
    <div class="container">
      <a class="marca" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="menu" aria-label="Menu principal">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Pranchas</a>
        <a href="{{ '/sobre/' | relative_url }}" {% if page.url == '/sobre/' %}aria-current="page"{% endif %}>Sobre</a>
        <a href="{{ '/direitos/' | relative_url }}" {% if page.url == '/direitos/' %}aria-current="page"{% endif %}>Direitos de uso</a>
        <button class="botao-tema" type="button" aria-label="Alternar tema">
          <svg class="icone-sol" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icone-lua" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="rodape">
    <div class="container">
      <span>Pesquisa de doutorado em andamento · {{ site.author }} · PPGCOM/UFC · CNPq</span>
      <span>Montagens: CC BY-NC-ND 4.0 · Imagens: © seus titulares (art. 46, Lei nº 9.610/1998)</span>
    </div>
  </footer>

  <!-- Botão de tema: alterna entre escuro e claro e lembra a escolha -->
  <script>
    (function () {
      var raiz = document.documentElement;
      var botao = document.querySelector('.botao-tema');

      function temaAtual() {
        var t = raiz.getAttribute('data-theme');
        if (t) return t;
        return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }

      function aplicar(t) {
        raiz.setAttribute('data-theme', t);
        botao.setAttribute('aria-label', t === 'dark' ? 'Alternar para o modo claro' : 'Alternar para o modo escuro');
      }

      aplicar(temaAtual());

      botao.addEventListener('click', function () {
        var novo = temaAtual() === 'dark' ? 'light' : 'dark';
        aplicar(novo);
        try { localStorage.setItem('tema', novo); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
